    <script type="text/javascript">
      // React SPA routing helper
      (function(spaLocation) {
        if (spaLocation.search[1] === '/' ) {
          var decoded = spaLocation.search.slice(1).split('&').map(function(search) { 
            return search.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null, spaLocation.pathname.slice(0, -1) + decoded + spaLocation.hash);
        }
      }(window.location));
    </script>
