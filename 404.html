<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>...</title>
    <script type='text/javascript'>
      const spaLocation = [
        window.location.protocol,
        '//',
        window.location.hostname,
        window.location.port ? ':' + window.location.port : '',
        window.location.pathname.split('/').slice(0, 1 + window.location.pathname.split('/').slice(1).indexOf(window.location.pathname.split('/')[1])).join('/'),
        '/?p=' + window.location.pathname.slice(1).replace(/&/g, '~and~'),
        window.location.search ? '&q=' + window.location.search.slice(1).replace(/&/g, '~and~') : '',
        window.location.hash
      ].join('');
      window.location.replace(spaLocation);
    </script>
  </head>
  <body>
  </body>
</html>
